<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Assinatura de e-mail · Nojosa Advocacia</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet"><style>:root{--font-sans:Inter,sans-serif;--font-display:Manrope,sans-serif}</style><style>body{margin:0;background:#F7F8F8;font-family:var(--font-sans);color:#1C2F3F}a{color:#1C2F3F}a:hover{color:#79513A}.wrap{max-width:860px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:24px}h1{margin:0;font:500 32px/1.15 var(--font-display);letter-spacing:-.02em}.f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;background:#fff;border-radius:12px;padding:20px;box-shadow:0 0 0 1px #E3E6E9}.f label{display:flex;flex-direction:column;gap:6px;font:600 11px/1.2 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:#5F6B76}.f .w2{grid-column:span 2}.f input{height:40px;border:1px solid #D5DADF;border-radius:8px;padding:0 12px;font:400 14px var(--font-sans);color:#1C2F3F;min-width:0}.f input:focus{outline:none;border-color:#1C2F3F}.opt{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #E3E6E9}.pv{padding:32px 28px;overflow-x:auto}.msg{font:400 15px/1.5 var(--font-sans);color:#1C2F3F;margin:0 0 12px}.ft{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid #E3E6E9}button{height:38px;padding:0 16px;border-radius:8px;border:1px solid #1C2F3F;background:#1C2F3F;color:#fff;font:500 14px var(--font-sans);cursor:pointer}button.o{background:#fff;color:#1C2F3F}button:hover{background:#253747;color:#fff}.ok{font:400 13px var(--font-sans);color:#2F6B52}@media(max-width:700px){.f{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><div class="wrap">
<h1>Assinatura de e-mail</h1>
<div class="f"><label>Nome<input id="nome" value="Gustavo Nojosa"></label><label>Cargo<input id="cargo" value="Advogado"></label><label>OAB<input id="oab" value="OAB/SP 458.519"></label><label>Telefone<input id="tel" value="11 94016 2573"></label><label class="w2">E-mail<input id="mail" value="contato@nojosa.com.br"></label><label class="w2">Site<input id="site" value="nojosa.com.br"></label><label class="w2">LinkedIn<input id="li" value="https://www.linkedin.com/company/nojosa-advocacia"></label><label class="w2">Instagram<input id="ig" value="https://www.instagram.com/nojosaadvocacia"></label></div>
<section class="opt"><div class="pv"><p class="msg">Att.,</p><div id="pv"></div></div><div class="ft"><button data-k="rich">Copiar assinatura</button><button class="o" data-k="html">Copiar HTML</button><span class="ok" id="ok"></span></div></section>
</div>
<script>
const BASE='https://raw.githubusercontent.com/nojuridico/claude/main/assinatura-email/';
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FD="font-family:Manrope,Aptos,'Segoe UI',Helvetica,Arial,sans-serif;mso-line-height-rule:exactly;";
const FT="font-family:Inter,Aptos,'Segoe UI',Helvetica,Arial,sans-serif;mso-line-height-rule:exactly;";
const AVISO='Esta mensagem e seus anexos podem conter informações confidenciais e protegidas por sigilo profissional. Se você não for o destinatário, desconsidere seu conteúdo e comunique o remetente. A divulgação, reprodução ou compartilhamento não autorizado é proibido.';
const im=(f,w,h,alt,st='')=>`<img src="${BASE}${f}" width="${w}" height="${h}" alt="${alt}" style="display:block;border:0;outline:none;width:${w}px;height:${h}px;${st}">`;
const T=(i,st='')=>`<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;${st}">${i}</table>`;
const item=(ic,href,txt,pr=18)=>`<td valign="middle" width="16" style="padding-right:7px;">${im('icone-'+ic+'.png',16,16,'')}</td><td valign="middle" style="padding-right:${pr}px;white-space:nowrap;"><a href="${href}" style="${FT}font-size:13px;line-height:18px;color:#46535F;text-decoration:none;">${txt}</a></td>`;
const soc=(ic,href,alt)=>`<td valign="middle" style="padding-left:8px;"><a href="${href}" style="text-decoration:none;">${im('icone-'+ic+'.png',28,28,alt)}</a></td>`;
function sig(){const v=k=>esc($(k).value.trim());const tel=v('tel');const site=v('site').replace(/^https?:\/\//,'');
return T(`<tr><td><div style="${FD}font-size:19px;line-height:24px;font-weight:700;color:#1C2F3F;letter-spacing:-0.2px;">${v('nome')}</div><div style="${FT}font-size:13px;line-height:18px;font-weight:500;color:#79513A;padding-top:3px;">${v('cargo')} &nbsp;·&nbsp; ${v('oab')}</div></td></tr>
<tr><td style="padding-top:14px;">${T(`<tr>${item('phone','tel:+55'+tel.replace(/\D/g,''),tel)}${item('mail','mailto:'+v('mail'),v('mail'))}${item('site','https://'+site,site,0)}</tr>`)}</td></tr>
<tr><td style="padding-top:18px;">${T(`<tr><td valign="middle" style="padding-right:20px;"><a href="https://${site}" style="text-decoration:none;">${im('logo-nojosa-claro.png',220,44,'Nojosa Advocacia')}</a></td><td valign="middle" style="border-left:1px solid #E0D9D2;padding-left:12px;">${T(`<tr>${soc('linkedin',v('li'),'LinkedIn')}${soc('instagram',v('ig'),'Instagram')}</tr>`)}</td></tr>`)}</td></tr>
<tr><td style="padding-top:18px;">${T(`<tr><td width="40" height="2" bgcolor="#AB7C60" style="font-size:0;line-height:0;width:40px;height:2px;background:#AB7C60;">&nbsp;</td></tr>`)}<div style="${FT}font-size:10px;line-height:15px;font-weight:400;color:#5F6B76;max-width:520px;padding-top:10px;">${AVISO}</div></td></tr>`,'max-width:560px;');}
const render=()=>{$('pv').innerHTML=sig();};
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));render();
document.querySelector('.ft').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const h=sig();const ok=$('ok');const flash=t=>{ok.textContent=t;setTimeout(()=>ok.textContent='',2500)};
try{if(b.dataset.k==='html'){await navigator.clipboard.writeText(h);flash('HTML copiado.');}else{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([h],{type:'text/html'}),'text/plain':new Blob([$('pv').innerText],{type:'text/plain'})})]);flash('Assinatura copiada.');}}catch(err){const r=document.createRange();r.selectNode($('pv'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();flash('Copiado.');}});
</script></body></html>
